<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Açaí Shop System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&family=Spline+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#2e073f',
              'brand-purple': '#4b204b',
              'brand-neon': '#aa33ff',
              'brand-pink': '#ff00ff',
            },
            fontFamily: {
              sans: ['"Space Grotesk"', '"Noto Sans"', 'sans-serif'],
              body: ['"Spline Sans"', '"Noto Sans"', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        font-family: "Space Grotesk", "Noto Sans", sans-serif;
        background-color: #1b0f24; 
        color: white;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1b0f24; 
      }
      ::-webkit-scrollbar-thumb {
        background: #39204b; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #522e6b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
